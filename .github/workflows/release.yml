name: Release

# Publishes to npm through the Trusted Publisher (OIDC) connection configured on
# https://www.npmjs.com/package/dynamsoft-license-mcp/settings - no token is stored.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Must match the "Environment name" on the Trusted Publisher form.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, which trusted publishing requires.
      # Node 22 ships npm 10 and fails with ENEEDAUTH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Tag must match package.json
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json is $pkg but the tag is $tag"
            exit 1
          fi
          echo "publishing $pkg with npm $(npm --version)"

      # No NODE_AUTH_TOKEN on purpose: npm exchanges the GitHub OIDC token.
      - name: Publish
        run: npm publish --access public
